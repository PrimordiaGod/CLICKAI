name: Android CI (build + unit tests + debug artifact)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platforms;android-34, build-tools;34.0.0)
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Verify Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build (debug) and test
        run: ./gradlew clean test assembleDebug --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14